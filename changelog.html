<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>更新日志看板 - 智慧运营一体化管理平台</title>
<style>
  :root {
    --primary: #2d7a6e;
    --primary-light: #3faa9a;
    --bg: #f0f2f5;
    --text: #303133;
    --text-regular: #606266;
    --text-secondary: #909399;
    --border: #e4e7ed;
    --card: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  header {
    height: 60px; background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; box-shadow: 0 4px 12px rgba(0,0,0,.1);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 12px; }
  header h1 .mod { font-size: 14px; padding: 4px 12px; background: rgba(255,255,255,.12); border-radius: 4px; font-weight: 400; }
  header .back { color: #fff; text-decoration: none; font-size: 14px; opacity: .9; }
  header .back:hover { opacity: 1; text-decoration: underline; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px; }

  /* 统计卡 */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  .stat-card { background: var(--card); border-radius: 8px; padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .stat-card .num { font-size: 28px; font-weight: 700; color: var(--primary); }
  .stat-card .label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .stat-card .mini { font-size: 12px; color: var(--text-regular); margin-top: 6px; }

  /* 过滤条 */
  .filters { background: var(--card); border-radius: 8px; padding: 14px 20px; margin-bottom: 20px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .filters label { color: var(--text-regular); font-size: 13px; }
  .filters select, .filters input {
    height: 32px; border: 1px solid var(--border); border-radius: 4px; padding: 0 10px;
    font-size: 13px; color: var(--text); outline: none; background: #fff;
  }
  .filters select:focus, .filters input:focus { border-color: var(--primary-light); }
  .filters input { width: 220px; }
  .filters .count { margin-left: auto; color: var(--text-secondary); font-size: 13px; }

  /* 时间线 */
  .timeline { position: relative; padding-left: 26px; }
  .timeline::before { content: ''; position: absolute; left: 8px; top: 4px; bottom: 4px; width: 2px; background: #d3e5e1; }
  .log-item { position: relative; margin-bottom: 14px; }
  .log-item::before {
    content: ''; position: absolute; left: -24px; top: 14px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--primary-light); border: 2px solid #fff; box-shadow: 0 0 0 2px #d3e5e1;
  }
  .log-card { background: var(--card); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden; cursor: pointer; }
  .log-head { width:100%; border:0; background:transparent; text-align:left; color:inherit; font:inherit; cursor:pointer; flex-wrap:wrap; }
  @media(max-width:700px){ .stats{grid-template-columns:repeat(2,1fr)} .wrap{padding:12px} header{height:auto;min-height:60px;padding:12px;gap:10px} header h1{flex-wrap:wrap;font-size:17px} .filters input{width:100%} .log-title{white-space:normal;min-width:120px} }
  .log-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.1); }
  .log-head { display: flex; align-items: center; gap: 10px; padding: 12px 18px; }
  .log-date { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 3px; font-weight: 600; flex-shrink: 0; }
  .tag-feat { background: #e6f4f1; color: #2d7a6e; }
  .tag-fix { background: #fdecec; color: #d0453f; }
  .tag-migrate { background: #e8f0fd; color: #3a6cc9; }
  .tag-docs { background: #f4f4f5; color: #7a7d85; }
  .tag-style { background: #fdf3e3; color: #b57d1f; }
  .tag-chore { background: #eef0f3; color: #5b6472; }
  .tag-revert { background: #fbe9e7; color: #bf360c; }
  .scope { font-size: 11px; color: var(--text-regular); background: #f0f2f5; padding: 2px 8px; border-radius: 3px; flex-shrink: 0; }
  .log-title { font-size: 14px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .author { font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }
  .log-detail { display: none; border-top: 1px dashed var(--border); padding: 12px 18px 14px 18px; white-space: pre-wrap;
    font-size: 13px; color: var(--text-regular); line-height: 1.8; background: #fafbfc; }
  .log-item.open .log-detail { display: block; }
  .pages { margin-top: 8px; font-size: 12px; color: var(--text-secondary); }
  .pages code { background: #eef2f1; padding: 1px 6px; border-radius: 3px; margin-right: 4px; }

  .empty { text-align: center; color: var(--text-secondary); padding: 60px 0; display: none; }
  footer { text-align: center; color: var(--text-secondary); font-size: 12px; padding: 24px 0 40px; line-height: 1.8; }
</style>
</head>
<body>
<header>
  <h1>更新日志看板 <span class="mod">安全生产管理 · 交接与审计</span></h1>
  <a class="back" href="./index.html">← 返回系统原型</a>
</header>

<div class="wrap">
  <!-- 统计卡 -->
  <div class="stats" id="stats"></div>

  <!-- 过滤条 -->
  <div class="filters">
    <label for="f-period">范围</label>
    <select id="f-period"><option value="recent">最近 50 条</option></select>
    <label for="f-category">分类</label>
    <select id="f-category"><option value="">全部分类</option><option value="ui">UI 界面</option><option value="data">数据与业务规则</option><option value="docs">文档与交接</option><option value="engineering">工程与运行</option></select>
    <label for="f-type">类型</label>
    <select id="f-type"><option value="">全部</option></select>
    <label for="f-scope">模块</label>
    <select id="f-scope"><option value="">全部</option></select>
    <input id="f-kw" type="search" aria-label="搜索日志摘要" placeholder="搜索标题 / 标签 / 页面标识 / 编号…">
    <span class="count" id="count"></span>
  </div>

  <p id="status" role="status" style="margin:0 0 16px;color:#606266">默认仅加载近期摘要，展开记录时加载详情。历史可按月份查询。</p>
  <!-- 时间线 -->
  <div class="timeline" id="timeline"></div>
  <div class="empty" id="empty">没有匹配的更新记录</div>

  <footer>
    数据与 UI 分离：摘要索引按月分片，详情按条归档并按需加载（规范见 agent.md §4）。<br>
    人工审计请核对：归档记录与 git log 提交「更新说明」（若仓库已 git 初始化）是否一一对应。
  </footer>
</div>

<script src="changelog/manifest.js"></script>
<script src="changelog/recent.js"></script>
<script src="changelog/ui.js"></script>
</body>
</html>
